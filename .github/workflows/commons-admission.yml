name: Proof Commons admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: commons-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve trusted test merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - name: Check out trusted base tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve and bind the immutable GitHub test merge
        id: merge
        run: node trusted/scripts/resolve-commons-merge.mjs >> "$GITHUB_OUTPUT"
        env:
          COMMONS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMONS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMONS_PULL_REQUEST: ${{ github.event.pull_request.number }}
          COMMONS_TRUSTED_ROOT: ${{ github.workspace }}/trusted
      - name: Mark trusted admission pending on the test merge
        run: node trusted/scripts/report-commons-status.mjs
        env:
          COMMONS_STATUS_STATE: pending
          COMMONS_STATUS_SHA: ${{ steps.merge.outputs.merge_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark trusted admission pending on the candidate head
        run: node trusted/scripts/report-commons-status.mjs
        env:
          COMMONS_STATUS_STATE: pending
          COMMONS_STATUS_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Offline dossier admission
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the exact untrusted test-merge tree as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.merge_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.13.0
      - name: Make the trusted base commit available to the candidate clone
        run: git -C candidate fetch --no-tags "$GITHUB_WORKSPACE/trusted" "$COMMONS_BASE_SHA"
        env:
          COMMONS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Validate candidate bytes with trusted-base code
        run: |
          set -eu
          node trusted/scripts/check-commons-pr.mjs
          node trusted/scripts/commons-registry.mjs --check
          node trusted/scripts/test-commons-registry.mjs
          node trusted/scripts/test-commons-pr.mjs
        env:
          COMMONS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COMMONS_HEAD_SHA: ${{ needs.prepare.outputs.merge_sha }}
          COMMONS_REPOSITORY_ROOT: ${{ github.workspace }}/candidate

  report:
    name: Report trusted admission
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out trusted base reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Report trusted admission on the test merge
        run: node trusted/scripts/report-commons-status.mjs
        env:
          COMMONS_STATUS_STATE: ${{ needs.validate.result == 'success' && 'success' || 'failure' }}
          COMMONS_STATUS_SHA: ${{ needs.prepare.outputs.merge_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report trusted admission on the candidate head
        run: node trusted/scripts/report-commons-status.mjs
        env:
          COMMONS_STATUS_STATE: ${{ needs.validate.result == 'success' && 'success' || 'failure' }}
          COMMONS_STATUS_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
